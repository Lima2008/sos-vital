<!--
    templates/perfil.html
    ------------------------------------------------------------------
    Formulário de cadastro opcional. Quando enviado (método POST),
    os dados vão para a rota perfil() em app.py, que chama
    salvar_usuario(...) em database/db.py.

    get_flashed_messages() é uma função pronta do Flask que devolve
    os avisos guardados por flash(...) — usamos para mostrar
    "Cadastro salvo!" ou o aviso de erro de validação.
    ------------------------------------------------------------------
-->
<!--
    templates/base.html
    ------------------------------------------------------------------
    Template "molde": define o esqueleto que se repete em toda página
    (topo com o logo e o botão SOS, barra de navegação embaixo, fontes
    e CSS). As outras páginas (inicio.html, guias.html, etc.) estendem
    este arquivo e só preenchem o bloco de conteúdo central.

    Aviso para quem for editar este comentário: como este arquivo
    inteiro é lido pelo Jinja (o motor de templates), NÃO escreva aqui
    dentro exemplos com chaves duplas ou "por cento-chave" de verdade
    — o Jinja não sabe que isto é um comentário de HTML e tentaria
    interpretar o exemplo como um comando de verdade.

    Isso evita copiar e colar o mesmo cabeçalho/rodapé em cada página.
    ------------------------------------------------------------------
-->
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil · SOS Vital</title>

  <!-- Fontes do Google Fonts: Fraunces (títulos), Manrope (texto),
       IBM Plex Mono (números / dados). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="estilo.css">

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0E6E63">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SOS Vital">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="SOS Vital: ligue 192 em 1 toque e siga os primeiros socorros passo a passo.">
</head>
<body>
  <div class="shell">

    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">♥</div>
        <span class="brand-name">SOS Vital</span>
      </div>
      <a class="sos-pill" href="sos.html">☎ SOS</a>
    </div>

    <main>
      
      
  <div style="padding: 20px 4px 4px;">
    <h1 style="font-size:1.4rem;">Seu perfil</h1>
    <p style="color:var(--ink-soft); font-size:.88rem; margin-top:6px;">
      Opcional — usado só para as estatísticas do projeto. Você pode
      usar o botão de emergência sem se cadastrar.
    </p>
  </div>

  
    
  

  <div id="msg-perfil"></div>
  <form id="form-perfil" method="post" action="perfil.html">
    <div class="field">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" placeholder="Como podemos te chamar" autocomplete="name">
    </div>

    <div class="field">
      <label for="idade">Idade</label>
      <input id="idade" name="idade" type="number" min="1" max="120" placeholder="Ex: 22" inputmode="numeric">
    </div>

    <div class="field">
      <label>Já fez algum curso de primeiros socorros?</label>
      <div class="seg">
        <label><input type="radio" name="fez_curso" value="sim"><span>Sim</span></label>
        <label><input type="radio" name="fez_curso" value="nao" checked><span>Não</span></label>
        <label><input type="radio" name="fez_curso" value="talvez"><span>Não lembro</span></label>
      </div>
    </div>

    <button class="btn-salvar" type="submit">Salvar cadastro</button>
  </form>

  <p class="nota-privacidade">
    Nesta versão publicada, os dados ficam guardados só neste celular e
    não são enviados, vendidos nem compartilhados.
  </p>

    </main>

    <nav class="tabbar">
      <a href="index.html" class="">
        <span>🏠</span><span>Início</span>
      </a>
      <a href="guias.html" class="">
        <span>📋</span><span>Guias</span>
      </a>
      <a href="impacto.html" class="">
        <span>📊</span><span>Impacto</span>
      </a>
      <a href="perfil.html" class="ativo">
        <span>👤</span><span>Perfil</span>
      </a>
    </nav>

  </div>

<script src="app.js"></script>
</body>
</html>
